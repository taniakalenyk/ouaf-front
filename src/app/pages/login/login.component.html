<div class="column-6 padding-x-2 gap-1-75">
  <div class="gap-05 f-column center">
    <p class="medium-title-text black">BIENVENUE !</p>
    <p class="bigger-body-text dark-grey">Veuillez entrer vos informations</p>
  </div>

  <form class="f-column gap-1-25">

    <div class="f-column gap-05">
      <label class="body-text black" for="email">E-mail</label>
      <input class="input body-text dark-grey" id="email" placeholder="Entrez votre adresse e-mail" type="email"/>
    </div>

    <div class="f-row flex space-between">
      <label class="body-text dark-grey f-row gap-1 black-hover">
        <input class="checkbox" type="checkbox"/>
        <span>Se souvenir de moi</span>
      </label>
      <a class="dark-grey body-text black-hover" href="#">Mot de passe oublié ?</a>
    </div>

    <div class="gap-1-5 f-column">
      <div class="gap-1 f-column flex">
        <app-button label="LOGIN" type="submit" variant="long"></app-button>
        <app-button label="Continuer avec Google" type="button" variant="google-button"></app-button>
      </div>

      <div class="f-row gap-05 center">
        <p class="body-text dark-grey">Pas encore de compte ?</p>
        <a class="body-text accent-color black-hover" routerLink="/signup">Créer un compte</a>
      </div>
    </div>

  </form>
</div>
