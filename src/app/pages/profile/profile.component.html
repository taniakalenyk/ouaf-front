<div class="height-100 width-100 f-column gap-1-75 padding-top-1">
  @let owner = owner$ | async;
  @if (owner) {
    <div class="profile-row gap-1-75">
      <app-card [owner]="owner" class="flex-2 profile-row-card"></app-card>
      <app-dogs class="flex-1" [dogs]="owner.dogs || []"></app-dogs>
    </div>
    <app-gallery></app-gallery>
    <!--    <app-gallery [dogs]="owner.dogs"></app-gallery>-->
  }
</div>
