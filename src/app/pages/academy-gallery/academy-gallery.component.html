<div class="height-100">
  <div class="f-column gap-2-25 gallery">
    <div class="space-between f-row">

      <div class="f-row gap-1-75 toggles">
        <app-toggle (toggleEvent)="onPolaroid()" label="polaroid"></app-toggle>
        <app-toggle (toggleEvent)="onZoom()" label="zoom"></app-toggle>
      </div>
      <div>
        <app-filepicker (picked)="onFilePicked($event)"></app-filepicker>
      </div>
    </div>

    <div [ngClass]="gap" class="f-row photos padding-bottom-1">
      <app-polaroid [polaroidView]="fullSize"
                    [zoomed]="zoom"

                    title="title"></app-polaroid>
