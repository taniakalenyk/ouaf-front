<button
  (click)="handleClick()"
  [ngClass]="variant"
  [type]="type"
>
  @if (variant === 'google-button') {
    <img
      alt="Google icon"
      height="20"
      src="/icons/google.svg"
      width="20"
    />
  }

  <span [ngClass]="variant === 'google-button' ? 'body-text' : 'button-text'">
    {{ label }}
  </span>
</button>
