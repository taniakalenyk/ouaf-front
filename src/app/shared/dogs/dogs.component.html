<div class="padding-x-1-75 padding-top-1-75 padding-bottom-0-5 gap-2 card height-100 f-column width-100 shadow">

  <!--    TOP TITLE    -->
  <div class="border-bottom gap-2 f-row space-between width-100 padding-bottom-1 border-bottom">
    <div class="f-row gap-0-5">

      <div class="icon-wrapper">
        <svg class="edit" fill="none" height="18" viewBox="0 0 18 18" width="18" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M6.02719 16.7477L15.0274 7.74753L10.7525 3.4726L1.75226 12.4728C1.62836 12.5969 1.54034 12.7522 1.49755 12.9222L0.5 18L5.57684 17.0025C5.7473 16.9598 5.90322 16.8717 6.02719 16.7477ZM17.9329 4.84205C18.296 4.47881 18.5 3.98622 18.5 3.4726C18.5 2.95898 18.296 2.46639 17.9329 2.10315L16.3968 0.567123C16.0336 0.203995 15.541 0 15.0274 0C14.5138 0 14.0212 0.203995 13.6579 0.567123L12.1219 2.10315L16.3968 6.37808L17.9329 4.84205Z"
            fill="currentColor"/>
        </svg>

      </div>

      <div class="icon-wrapper">
        <svg class="edit" fill="none" height="18" viewBox="0 0 18 18" width="18" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.5 11.25H11.75V18H7.25V11.25H0.5V6.75H7.25V0H11.75V6.75H18.5V11.25Z" fill="currentColor"/>
        </svg>
      </div>

    </div>

    @if (dogs.length > 0) {
      <a class="button-text dark-grey" routerLink="/dog-profile">Mes Chiens</a>
    } @else {
      <span class="button-text dark-grey">Mes Chiens</span>
    }
  </div>

  <div class="dog-pictures">
    @if (dogs.length > 0) {
      @for (dog of dogs; track dog.dogId) {
        <div (click)="onClicked(dog)">
          <app-polaroid
            [imageUrl]="dog.photoId ? '/images/gallery/' + dog.photoId : '/images/profile-picture.png'"
            size="small"
            [title]="dog.name">
          </app-polaroid>
        </div>
      }
    } @else {
      <p class="small-italic dark-grey center padding-x-2 padding-bottom-2">Vous n'avez pas encore renseigné les
        informations sur vos chiens.</p>
    }
  </div>
</div>
