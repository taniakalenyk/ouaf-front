<div class="f-row gap-1">
  <label [ngClass]="size === 'small' ? 'toggle-switch-small' : 'toggle-switch'">
    <input (click)="toggle()" type="checkbox"/>
    <div class="toggle-switch-background">
      <!--      <div class="toggle-switch-handle"></div>-->
      <div [ngClass]="size === 'small' ? 'toggle-switch-handle-small' : 'toggle-switch-handle'"></div>
    </div>
  </label>
  <p class="dark-grey body-text">{{ label }}</p>
</div>
