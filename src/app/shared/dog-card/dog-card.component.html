<div class="f-row card shadow width-100">
  <div class="profile-picture">
    <img [src]="dog.photoId ? '/images/gallery/' + dog.photoId : '/images/profile-picture.png'"
         alt="Dog profile picture"/>
  </div>

  <div class="border-card-right f-column space-between width-100 padding-1-75 gap-2 height-100">

    <!--    TOP NAME    -->
    <div class="f-row space-between padding-bottom-1 border-bottom">
      <div class="f-row gap-1-5">
        <span class="button-text black">{{ dog.name }}</span>
        <span class="copyright-text dark-grey">{{ age }}</span>
      </div>

      <div class="icon-wrapper">
        <svg class="edit" fill="none" height="18" viewBox="0 0 18 18" width="18" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M6.02719 16.7477L15.0274 7.74753L10.7525 3.4726L1.75226 12.4728C1.62836 12.5969 1.54034 12.7522 1.49755 12.9222L0.5 18L5.57684 17.0025C5.7473 16.9598 5.90322 16.8717 6.02719 16.7477ZM17.9329 4.84205C18.296 4.47881 18.5 3.98622 18.5 3.4726C18.5 2.95898 18.296 2.46639 17.9329 2.10315L16.3968 0.567123C16.0336 0.203995 15.541 0 15.0274 0C14.5138 0 14.0212 0.203995 13.6579 0.567123L12.1219 2.10315L16.3968 6.37808L17.9329 4.84205Z"
            fill="currentColor"/>
        </svg>
      </div>
    </div>


    <div class="f-row gap-2-5 height-100">

      <div class="column gap-0-65 height-100 flex-1">

        <!--          BREED          -->
        <div class="gap-1 f-row card-text dark-grey">
          <div class="accent-color small-icon">
            <svg fill="none" height="14" viewBox="0 0 14 14" width="14" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M0 6.38716C0 7.6446 0.692017 8.60989 1.59031 8.60989C2.4886 8.60989 3.18727 7.6446 3.18727 6.38716C3.18727 5.13605 2.4886 4.16438 1.59031 4.16438C0.692017 4.16438 0 5.13605 0 6.38716ZM3.22719 2.72276C3.22719 3.97386 3.93252 4.93918 4.82415 4.93918C5.72907 4.93918 6.42776 3.96751 6.42776 2.72276C6.42776 1.46531 5.72907 0.5 4.82415 0.5C3.93252 0.5 3.22719 1.46531 3.22719 2.72276ZM7.57894 2.72276C7.57894 3.96751 8.27093 4.93918 9.1759 4.93918C10.0675 4.93918 10.7729 3.97386 10.7729 2.72276C10.7729 1.46531 10.0675 0.5 9.1759 0.5C8.27093 0.5 7.57894 1.46531 7.57894 2.72276ZM10.8128 6.38716C10.8128 7.6446 11.5114 8.60989 12.4097 8.60989C13.308 8.60989 14 7.6446 14 6.38716C14 5.13605 13.308 4.16438 12.4097 4.16438C11.5114 4.16438 10.8128 5.13605 10.8128 6.38716ZM1.9962 11.3026C1.9962 12.5855 2.90115 13.5 4.23195 13.5C4.89069 13.5 5.36978 13.3222 5.8289 13.1697C6.20155 13.0427 6.56086 12.9284 7 12.9284C7.4325 12.9284 7.79187 13.0427 8.17111 13.1697C8.63024 13.3222 9.10265 13.5 9.76142 13.5C11.0989 13.5 12.0038 12.5855 12.0038 11.3026C12.0038 10.2103 11.3185 9.65776 10.6597 9.14336C10.2937 8.86394 9.94108 8.59721 9.70152 8.24159C9.50193 7.95578 9.33557 7.6446 9.19583 7.35244C8.71677 6.37442 8.33747 5.45358 7 5.45358C5.65591 5.45358 5.28328 6.37442 4.80419 7.3461C4.6578 7.6446 4.49811 7.94944 4.30514 8.22886C4.05894 8.58452 3.69962 8.86394 3.34031 9.14336C2.68157 9.65776 1.9962 10.2167 1.9962 11.3026Z"
                fill="currentColor"/>
            </svg>
          </div>
          <span>{{ breed }}</span>
        </div>

        <!--          GENDER         -->
        <div class="gap-1 f-row card-text dark-grey">

          @if (dog.gender) {
            <div class="small-icon">
              <svg class="accent-color" width="11" height="15" viewBox="0 0 11 15" fill="none"
                   xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M5.5 0C6.82608 0 8.09785 0.526784 9.03553 1.46447C9.97322 2.40215 10.5 3.67392 10.5 5C10.5 7.475 8.7 9.53333 6.33333 9.93333V11.6667H8V13.3333H6.33333V15H4.66667V13.3333H3V11.6667H4.66667V9.93333C2.3 9.53333 0.5 7.475 0.5 5C0.5 3.67392 1.02678 2.40215 1.96447 1.46447C2.90215 0.526784 4.17392 0 5.5 0ZM5.5 1.66667C4.61594 1.66667 3.7681 2.01786 3.14298 2.64298C2.51786 3.2681 2.16667 4.11594 2.16667 5C2.16667 5.88405 2.51786 6.7319 3.14298 7.35702C3.7681 7.98214 4.61594 8.33333 5.5 8.33333C6.38405 8.33333 7.2319 7.98214 7.85702 7.35702C8.48214 6.7319 8.83333 5.88405 8.83333 5C8.83333 4.11594 8.48214 3.2681 7.85702 2.64298C7.2319 2.01786 6.38405 1.66667 5.5 1.66667Z"
                  fill="currentColor"/>
              </svg>
            </div>

            <span>Femelle</span>
          } @else {
            <div class="small-icon">
              <svg class="accent-color" width="16" height="16" viewBox="0 0 16 16" fill="none"
                   xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M5.25 5.25C6.325 5.25 7.33333 5.59167 8.14167 6.175L12.4 1.91667H8.58333V0.25H15.25V6.91667H13.5833V3.09167L9.325 7.33333C9.90833 8.16667 10.25 9.16667 10.25 10.25C10.25 11.5761 9.72322 12.8479 8.78553 13.7855C7.84785 14.7232 6.57608 15.25 5.25 15.25C3.92392 15.25 2.65215 14.7232 1.71447 13.7855C0.776784 12.8479 0.25 11.5761 0.25 10.25C0.25 8.92392 0.776784 7.65215 1.71447 6.71447C2.65215 5.77678 3.92392 5.25 5.25 5.25ZM5.25 6.91667C4.36594 6.91667 3.5181 7.26786 2.89298 7.89298C2.26786 8.5181 1.91667 9.36594 1.91667 10.25C1.91667 11.1341 2.26786 11.9819 2.89298 12.607C3.5181 13.2321 4.36594 13.5833 5.25 13.5833C6.13405 13.5833 6.9819 13.2321 7.60702 12.607C8.23214 11.9819 8.58333 11.1341 8.58333 10.25C8.58333 9.36594 8.23214 8.5181 7.60702 7.89298C6.9819 7.26786 6.13405 6.91667 5.25 6.91667Z"
                  fill="currentColor"/>
              </svg>
            </div>

            <span>Male</span>
          }
        </div>

        <!--          BIRTHDAY         -->
        <div class="gap-1 f-row card-text ">
          <div class="small-icon">
            <svg class="accent-color" fill="none" height="16" viewBox="0 0 16 16" width="16"
                 xmlns="http://www.w3.org/2000/svg">
              <path
                d="M8.00325 3.00434C8.47873 3.00434 8.85651 2.57391 8.85651 2.01766C8.85651 1.44818 8.68066 1.07734 8.36797 0.706515C8.15954 0.441636 7.87948 0.435014 7.66455 0.666783C7.35191 1.05086 7.14999 1.42831 7.14999 2.01766C7.14999 2.57391 7.53427 3.00434 8.00325 3.00434ZM7.63198 6.05707H8.35496V2.29579H7.63198V6.05707ZM3.75011 8.10328H12.2564V7.63975C12.2564 6.32854 11.592 5.65976 10.2829 5.65976H5.72362C4.42097 5.65976 3.75011 6.32854 3.75011 7.63975V8.10328ZM1.52909 15.0365H14.4709V10.9838C14.4709 9.67266 13.8065 9.00384 12.5039 9.00384H3.5026C2.19995 9.00384 1.52909 9.67266 1.52909 10.9838V15.0365ZM7.99675 12.242C7.35191 12.242 6.89599 13.0102 5.96461 13.0102C5.06578 13.0102 4.63591 12.242 4.03669 12.242C3.42444 12.242 2.99457 13.0102 1.7766 13.0102H1.52909V12.1361H1.7766C2.70148 12.1361 3.15089 11.3679 4.03669 11.3679C4.90295 11.3679 5.25467 12.1361 5.96461 12.1361C6.79828 12.1361 7.11092 11.3679 7.99675 11.3679C8.88252 11.3679 9.19516 12.1361 10.0354 12.1361C10.7453 12.1361 11.0905 11.3679 11.9633 11.3679C12.8361 11.3679 13.292 12.1361 14.2104 12.1361H14.4709V13.0102H14.2104C12.9989 13.0102 12.5625 12.242 11.9633 12.242C11.351 12.242 10.9277 13.0102 10.0354 13.0102C9.0975 13.0102 8.63503 12.242 7.99675 12.242ZM1.02106 15.5H14.9789C15.2655 15.5 15.5 15.255 15.5 14.9636C15.5 14.6723 15.2655 14.4339 14.9789 14.4339H1.02106C0.734477 14.4339 0.5 14.6723 0.5 14.9636C0.5 15.255 0.734477 15.5 1.02106 15.5Z"
                fill="currentColor"/>
            </svg>
          </div>

          <span class="dark-grey">{{ dog.birthDate | date:'dd / MM / yyyy' }}</span>
        </div>

        <!--          ADDRESS         -->
        <div class="gap-1 f-row card-text dark-grey">
          <div class="accent-color small-icon">
            <svg fill="none" height="18" viewBox="0 0 18 18" width="18" xmlns="http://www.w3.org/2000/svg">
              <g clip-path="url(#clip0_1222_2693)">
                <path
                  d="M6.75 4.5C6.75 5.09674 6.98705 5.66903 7.40901 6.09099C7.83097 6.51295 8.40326 6.75 9 6.75C9.59674 6.75 10.169 6.51295 10.591 6.09099C11.0129 5.66903 11.25 5.09674 11.25 4.5C11.25 3.90326 11.0129 3.33097 10.591 2.90901C10.169 2.48705 9.59674 2.25 9 2.25C8.40326 2.25 7.83097 2.48705 7.40901 2.90901C6.98705 3.33097 6.75 3.90326 6.75 4.5Z"
                  stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
                <path
                  d="M5.12728 6.75H12.8748C13.0504 6.74997 13.2205 6.8116 13.3554 6.92412C13.4902 7.03665 13.5813 7.19294 13.6128 7.36575L14.8405 14.1157C14.8602 14.2238 14.8559 14.3349 14.8279 14.4412C14.7999 14.5474 14.7488 14.6462 14.6784 14.7306C14.608 14.8149 14.52 14.8828 14.4205 14.9293C14.3209 14.9759 14.2124 15 14.1025 15H3.89953C3.78966 15 3.68112 14.9759 3.5816 14.9293C3.48208 14.8828 3.39401 14.8149 3.32361 14.7306C3.25321 14.6462 3.2022 14.5474 3.17419 14.4412C3.14618 14.3349 3.14186 14.2238 3.16153 14.1157L4.38928 7.36575C4.42072 7.19294 4.51181 7.03665 4.64668 6.92412C4.78155 6.8116 4.95163 6.74997 5.12728 6.75Z"
                  fill="currentColor" stroke="#D63621" stroke-linecap="round" stroke-linejoin="round"
                  stroke-width="1.5"/>
              </g>
            </svg>
          </div>

          <span class="dark-grey">{{ dog.weight }} kg</span>
        </div>

        <!--          STERILIZED         -->
        <div class="gap-1 f-row card-text dark-grey">
          <div class="accent-color small-icon">
            <svg fill="none" height="16" viewBox="0 0 12 16" width="12" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M10.125 2.375H7.83333C7.83333 1.34082 7.0112 0.5 6 0.5C4.9888 0.5 4.16667 1.34082 4.16667 2.375H1.875C1.11589 2.375 0.5 3.00488 0.5 3.78125V14.0938C0.5 14.8701 1.11589 15.5 1.875 15.5H10.125C10.8841 15.5 11.5 14.8701 11.5 14.0938V3.78125C11.5 3.00488 10.8841 2.375 10.125 2.375ZM6 1.67188C6.38099 1.67188 6.6875 1.98535 6.6875 2.375C6.6875 2.76465 6.38099 3.07812 6 3.07812C5.61901 3.07812 5.3125 2.76465 5.3125 2.375C5.3125 1.98535 5.61901 1.67188 6 1.67188ZM8.75 10.5781C8.75 10.707 8.64688 10.8125 8.52083 10.8125H6.91667V12.4531C6.91667 12.582 6.81354 12.6875 6.6875 12.6875H5.3125C5.18646 12.6875 5.08333 12.582 5.08333 12.4531V10.8125H3.47917C3.35312 10.8125 3.25 10.707 3.25 10.5781V9.17188C3.25 9.04297 3.35312 8.9375 3.47917 8.9375H5.08333V7.29688C5.08333 7.16797 5.18646 7.0625 5.3125 7.0625H6.6875C6.81354 7.0625 6.91667 7.16797 6.91667 7.29688V8.9375H8.52083C8.64688 8.9375 8.75 9.04297 8.75 9.17188V10.5781ZM8.75 4.95312C8.75 5.08203 8.64688 5.1875 8.52083 5.1875H3.47917C3.35312 5.1875 3.25 5.08203 3.25 4.95312V4.48437C3.25 4.35547 3.35312 4.25 3.47917 4.25H8.52083C8.64688 4.25 8.75 4.35547 8.75 4.48437V4.95312Z"
                fill="currentColor"/>
            </svg>
          </div>
          <span>
            {{ dog.sterilized ? (dog.gender ? 'Stérilisée' : 'Stérilisé') : (dog.gender ? 'Non stérilisée' : 'Non stérilisé') }}
          </span>
        </div>
      </div>

      <!--          DESCRIPTION         -->
      <div class="description flex-2 gap-0-65">
        <div class="gap-1 f-row card-text">
          <div class="small-icon">
            <svg class="accent-color" fill="none" height="16" viewBox="0 0 13 16" width="13"
                 xmlns="http://www.w3.org/2000/svg">
              <path
                d="M1.83705 0.5C1.10167 0.5 0.5 1.14286 0.5 1.92857V13.3571C0.5 14.1429 1.10167 14.7857 1.83705 14.7857H4.51114V13.4286L11.1964 6.28571V4.78571L7.18524 0.5H1.83705ZM6.51671 1.57143L10.1936 5.5H6.51671V1.57143ZM11.2632 8.35714C11.1964 8.35714 11.0627 8.42857 10.9958 8.5L10.3273 9.21429L11.7312 10.7143L12.3997 10C12.5334 9.85714 12.5334 9.57143 12.3997 9.42857L11.5306 8.5C11.4638 8.42857 11.3969 8.35714 11.2632 8.35714ZM9.92618 9.64286L5.84819 14V15.5H7.25209L11.3301 11.1429L9.92618 9.64286Z"
                fill="currentColor"/>
            </svg>
          </div>

          <span class="dark-grey">Notes</span>
        </div>

        <div class="dark-grey small-italic">
          <div class="scroll"> {{ dog.notes }}</div>
        </div>
      </div>

    </div>

  </div>
</div>
