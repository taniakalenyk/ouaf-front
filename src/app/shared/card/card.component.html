<div class="f-row flex-2 card shadow">
  <div class="profile-picture">
    <img [src]="profilePicture || '/images/profile-picture.png'" alt="Profile picture"/>
  </div>

  <div class="border-card-right f-column space-between width-100 padding-1-75 gap-2-25 height-100">

    <!--    TOP NAME    -->
    <div class="f-row space-between padding-bottom-1 border-bottom">
      <div class="f-row gap-0-5">
        <span class="button-text black">{{ lastname }}</span>
        <span class="button-text accent-color">{{ firstname }}</span>
      </div>

      <div class="icon-wrapper">
        <svg class="edit" fill="none" height="18" viewBox="0 0 18 18" width="18" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M6.02719 16.7477L15.0274 7.74753L10.7525 3.4726L1.75226 12.4728C1.62836 12.5969 1.54034 12.7522 1.49755 12.9222L0.5 18L5.57684 17.0025C5.7473 16.9598 5.90322 16.8717 6.02719 16.7477ZM17.9329 4.84205C18.296 4.47881 18.5 3.98622 18.5 3.4726C18.5 2.95898 18.296 2.46639 17.9329 2.10315L16.3968 0.567123C16.0336 0.203995 15.541 0 15.0274 0C14.5138 0 14.0212 0.203995 13.6579 0.567123L12.1219 2.10315L16.3968 6.37808L17.9329 4.84205Z"
            fill="currentColor"/>
        </svg>
      </div>
    </div>


    <div class="f-row gap-3 height-100">
      <div class="f-column gap-0-65 height-100">

        <!--          EMAIL          -->
        <div class="gap-1 f-row card-text dark-grey">
          <div class="accent-color">
            <svg fill="none" height="14" viewBox="0 0 14 14" width="14" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M7 0C3.1314 0 0 3.13078 0 7C0 10.8686 3.13078 14 7 14C8.35919 14 9.6911 13.6009 10.822 12.8647C11.1609 12.6441 11.2348 12.1791 10.9787 11.8663L10.6915 11.5153C10.4749 11.2508 10.0937 11.186 9.80593 11.3706C8.97355 11.9044 7.99677 12.1935 7 12.1935C4.13627 12.1935 1.80645 9.86373 1.80645 7C1.80645 4.13627 4.13627 1.80645 7 1.80645C9.8265 1.80645 12.1935 3.43279 12.1935 6.32258C12.1935 7.41735 11.5982 8.57336 10.5517 8.68488C10.062 8.67207 10.0744 8.32198 10.1713 7.83743L10.8327 4.419C10.9136 4.00101 10.5934 3.6129 10.1676 3.6129H8.89802C8.80427 3.6129 8.71381 3.64741 8.64388 3.70984C8.57396 3.77228 8.52946 3.85827 8.51889 3.95142L8.5186 3.95401C8.10377 3.44874 7.37693 3.3394 6.82587 3.3394C4.72079 3.3394 2.93548 5.096 2.93548 7.61448C2.93548 9.45771 3.97377 10.6027 5.64516 10.6027C6.40681 10.6027 7.26445 10.1614 7.76184 9.52076C8.03061 10.4834 8.90818 10.4833 9.75769 10.4833C12.8317 10.4833 14 8.46204 14 6.32258C14 2.47408 10.8958 0 7 0ZM6.38806 8.59278C5.76007 8.59278 5.36996 8.15181 5.36996 7.44199C5.36996 6.17202 6.23872 5.38915 7.02484 5.38915C7.65405 5.38915 8.02971 5.81934 8.02971 6.53992C8.02971 7.8118 7.07356 8.59278 6.38806 8.59278Z"
                fill="currentColor"/>
            </svg>
          </div>

          <span>{{ email }}</span>
        </div>

        <!--          PHONE         -->
        <div class="gap-1 f-row card-text dark-grey">
          <div class="accent-color">
            <svg fill="none" height="14" viewBox="0 0 14 14" width="14" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M13.9996 10.4817V12.5893C14.0004 12.7849 13.9602 12.9786 13.8817 13.1578C13.8031 13.3371 13.6879 13.498 13.5435 13.6303C13.399 13.7626 13.2285 13.8633 13.0428 13.9259C12.8571 13.9886 12.6603 14.0119 12.465 13.9943C10.299 13.7594 8.2183 13.0207 6.39023 11.8376C4.68945 10.7589 3.24748 9.31984 2.16674 7.62243C0.977102 5.78969 0.236769 3.70306 0.00571348 1.53156C-0.011877 1.33729 0.0112568 1.1415 0.0736417 0.956639C0.136027 0.77178 0.236296 0.601911 0.368066 0.457846C0.499835 0.313781 0.660218 0.198678 0.839003 0.119863C1.01779 0.0410494 1.21106 0.000251806 1.40651 6.81111e-05H3.51826C3.85987 -0.00328744 4.19105 0.117444 4.45007 0.33976C4.70909 0.562076 4.87827 0.870806 4.92609 1.20841C5.01522 1.88287 5.18052 2.54511 5.41883 3.18249C5.51354 3.43394 5.53403 3.70721 5.47789 3.96993C5.42175 4.23265 5.29132 4.4738 5.10207 4.66481L4.20809 5.55701C5.21016 7.31581 6.6693 8.77206 8.43159 9.77214L9.32556 8.87994C9.51695 8.69106 9.75858 8.56089 10.0218 8.50486C10.2851 8.44883 10.5589 8.46929 10.8108 8.56381C11.4495 8.80164 12.113 8.96662 12.7888 9.05557C13.1308 9.10371 13.4431 9.2756 13.6663 9.53855C13.8895 9.8015 14.0081 10.1372 13.9996 10.4817Z"
                fill="currentColor"/>
            </svg>
          </div>

          <span>{{ phone }}</span>
        </div>

        <!--          BIRTHDAY         -->
        <div class="gap-1 f-row card-text">
          <div>
            <svg class="accent-color" fill="none" height="16" viewBox="0 0 16 16" width="16"
                 xmlns="http://www.w3.org/2000/svg">
              <path
                d="M8.00325 3.00434C8.47873 3.00434 8.85651 2.57391 8.85651 2.01766C8.85651 1.44818 8.68066 1.07734 8.36797 0.706515C8.15954 0.441636 7.87948 0.435014 7.66455 0.666783C7.35191 1.05086 7.14999 1.42831 7.14999 2.01766C7.14999 2.57391 7.53427 3.00434 8.00325 3.00434ZM7.63198 6.05707H8.35496V2.29579H7.63198V6.05707ZM3.75011 8.10328H12.2564V7.63975C12.2564 6.32854 11.592 5.65976 10.2829 5.65976H5.72362C4.42097 5.65976 3.75011 6.32854 3.75011 7.63975V8.10328ZM1.52909 15.0365H14.4709V10.9838C14.4709 9.67266 13.8065 9.00384 12.5039 9.00384H3.5026C2.19995 9.00384 1.52909 9.67266 1.52909 10.9838V15.0365ZM7.99675 12.242C7.35191 12.242 6.89599 13.0102 5.96461 13.0102C5.06578 13.0102 4.63591 12.242 4.03669 12.242C3.42444 12.242 2.99457 13.0102 1.7766 13.0102H1.52909V12.1361H1.7766C2.70148 12.1361 3.15089 11.3679 4.03669 11.3679C4.90295 11.3679 5.25467 12.1361 5.96461 12.1361C6.79828 12.1361 7.11092 11.3679 7.99675 11.3679C8.88252 11.3679 9.19516 12.1361 10.0354 12.1361C10.7453 12.1361 11.0905 11.3679 11.9633 11.3679C12.8361 11.3679 13.292 12.1361 14.2104 12.1361H14.4709V13.0102H14.2104C12.9989 13.0102 12.5625 12.242 11.9633 12.242C11.351 12.242 10.9277 13.0102 10.0354 13.0102C9.0975 13.0102 8.63503 12.242 7.99675 12.242ZM1.02106 15.5H14.9789C15.2655 15.5 15.5 15.255 15.5 14.9636C15.5 14.6723 15.2655 14.4339 14.9789 14.4339H1.02106C0.734477 14.4339 0.5 14.6723 0.5 14.9636C0.5 15.255 0.734477 15.5 1.02106 15.5Z"
                fill="currentColor"/>
            </svg>
          </div>

          <span class="dark-grey">{{ birthday }}</span>
        </div>

        <!--          ADDRESS         -->
        <div class="gap-1 f-row card-text dark-grey">
          <div class="accent-color height-100 padding-top-0-25">
            <svg fill="none" height="14" viewBox="0 0 14 14" width="14" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M11.375 4.77805V1.3125H9.1875V2.91074L7 0.875L0 7.4375H1.75V13.125H5.6875V8.75H8.3125V13.125H12.25V7.4375H14L11.375 4.77805Z"
                fill="currentColor"/>
            </svg>
          </div>

          <div class="f-column">
            <span>{{ address }}</span>
            <p>{{ city }}</p>
          </div>
        </div>
      </div>

      <div class="description">
        <div class=" description-text dark-grey small-italic">
          <div class="scroll"> {{ description }}</div>
        </div>
        <div>
          <svg class="accent-color" fill="none" height="13" viewBox="0 0 18 13" width="18"
               xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3.95155 4.72727C6.124 4.72727 7.88511 6.57918 7.88511 8.86364C7.88511 11.1481 6.124 13 3.95155 13C1.7791 13 0.017982 11.1481 0.017982 8.86364L0 8.27273C0 3.70382 3.52223 0 7.86713 0V2.36364C6.36563 2.36364 4.95517 2.97818 3.89311 4.09382C3.68856 4.30891 3.502 4.537 3.33454 4.77691C3.53571 4.74382 3.74138 4.72609 3.95042 4.72609L3.95155 4.72727ZM14.0664 4.72727C16.2389 4.72727 18 6.57918 18 8.86364C18 11.1481 16.2389 13 14.0664 13C11.894 13 10.1329 11.1481 10.1329 8.86364L10.1149 8.27273C10.1149 3.70382 13.6371 0 17.982 0V2.36364C16.4805 2.36364 15.0701 2.97818 14.008 4.09382C13.8034 4.30891 13.6169 4.537 13.4494 4.77691C13.6506 4.74382 13.8563 4.72609 14.0664 4.72609V4.72727Z"
              fill="currentColor"/>
          </svg>
        </div>
      </div>

    </div>

  </div>

</div>
