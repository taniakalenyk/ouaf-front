<input #filepicker (change)="onFilePicked($event)" hidden type="file">

<div (click)="filepicker.click()" class="f-row gap-1 filepicker">
  <div class="icon-wrapper">
    <svg class="edit" fill="none" height="18" viewBox="0 0 18 18" width="18" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.5 11.25H11.75V18H7.25V11.25H0.5V6.75H7.25V0H11.75V6.75H18.5V11.25Z" fill="currentColor"/>
    </svg>
  </div>

  <span class="dark-grey body-text">{{ pickedFile?.name ?? 'rajouter une image' }}</span>
</div>
