<label class="checkbox-wrapper">
  <input (change)="onCheckboxChange($event)" [checked]="checked" class="checkbox" type="checkbox"/>
  <span [ngClass]="backgr === 'dark' ? 'light-label' : 'dark-grey'"
        class="body-text">{{ label }}</span>
  <span [ngClass]="backgr === 'dark' ? 'light-label' : 'dark-grey'"
        class="small-italic">{{ additionLabel }}</span>
</label>
